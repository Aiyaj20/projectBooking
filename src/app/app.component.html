<nz-layout *ngIf="isLogedIn">
  <!-- <nz-sider nzCollapsible [(nzCollapsed)]="isCollapsed"  [nzTrigger]="null"> -->

  <nz-sider
    style="position: fixed"
    [ngClass]="screenwidth > 768 ? 'menu-sidebar' : 'menu-sidebar2'"
    nzCollapsible
    nzWidth="256px"
    nzBreakpoint="md"
    [(nzCollapsed)]="isCollapsed"
  >
    <div nz-row class="sidebar-logo">
      <div nz-col nzSpan="24" style="text-align: center">
        <h1
          style="
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
          "
        >
          {{ isCollapsed ? "" : (USERNAME | uppercase) }}
        </h1>
      </div>
    </div>

    <div style="overflow: auto; height: 500px">
      <ul nz-menu nzMode="inline" nzTheme="dark">
        <ng-container
          *ngTemplateOutlet="menuTpl; context: { $implicit: menus }"
        ></ng-container>
        <ng-template #menuTpl let-menus>
          <ng-container *ngFor="let menu of menus">
            <li
              *ngIf="!menu.children"
              nz-menu-item
              [nzPaddingLeft]="menu.level * 24"
              [nzDisabled]="menu.disabled"
              nzMatchRouter
            >
              <a [routerLink]="[menu.link]"
                ><i nz-icon [nzType]="menu.icon" *ngIf="menu.icon"></i>
                {{ isCollapsed ? "" : menu.title }}</a
              >
            </li>

            <li
              *ngIf="menu.children"
              nz-submenu
              [nzPaddingLeft]="menu.level * 24"
              [nzOpen]="menu.open"
              [nzTitle]="menu.title"
              [nzIcon]="menu.icon"
              [nzDisabled]="menu.disabled"
            >
              <ul>
                <ng-container
                  *ngTemplateOutlet="
                    menuTpl;
                    context: { $implicit: menu.children }
                  "
                ></ng-container>
              </ul>
            </li>
          </ng-container>
        </ng-template>
