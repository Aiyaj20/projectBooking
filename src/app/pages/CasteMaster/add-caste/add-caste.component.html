<div>
    <!-- <form nz-form #form8> -->
    <form nz-form #websitebannerPage="ngForm">
      <nz-spin [nzSpinning]="isSpinning">
        <div nz-row>
          <div nz-row class="my-box1" style="width: 100%">
            <div nz-col nzSpan="24">
            
  
              <div nz-col nzSpan="24">
                <nz-form-item>
                  <nz-form-label nzRequired nzNoColon>Caste Name</nz-form-label>
                  <nz-form-control
                    nzHasFeedback
                    nzErrorTip="Please Enter Cast Name"
                  >
                    <input
                      nz-input
                      name="castename"
                      [(ngModel)]="data.NAME"
                      maxlength="128"
                      required
                      placeholder="Enter Cast Name"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
  
              <div nz-row>
                <div nz-col nzSpan="12">
                  <nz-form-item>
                    <nz-form-label nzRequired nzNoColon>Nick Name</nz-form-label>
                    <nz-form-control
                      nzHasFeedback
                      nzErrorTip="Please Enter Nick Name"
                    >
                      <input
                        nz-input
                        name="ickname"
                        [(ngModel)]="data.NICKNAME"
                        maxlength="128"
                        required
                        placeholder="Enter Nick Name"
                      />
                    </nz-form-control>
                  </nz-form-item>
                </div>
                <div nz-col nzSpan="12">
                  <nz-form-item>
                    <nz-form-label nzRequired nzNoColon>Date of Birth</nz-form-label>
                    <nz-form-control
                      nzHasFeedback
                      nzErrorTip="Please Select Date of Birth "
                    >
                      <nz-date-picker
                        required
                        nz-input
                        name="dob"
                        style="width: 100%"
                        [(ngModel)]="data.DOB"
                        nzFormat="dd-MM-yyyy "
                        
                      >
                      </nz-date-picker>
                    </nz-form-control>
                  </nz-form-item>
                </div>
  
              
              </div>
              <div nz-row>
              <div nz-col nzSpan="12">
                <nz-form-item>
                  <nz-form-label nzRequired nzNoColon>Birth Place</nz-form-label>
                  <nz-form-control
                    nzHasFeedback
                    nzErrorTip="Please Enter Birth Place"
                  >
                    <input
                      nz-input
                      name="birthplace"
                      [(ngModel)]="data.BIRTHPLACE"
                      maxlength="128"
                      required
                      placeholder="Enter Birth Place"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div nz-col nzSpan="12">
                <nz-form-item>
                  <nz-form-label nzRequired nzNoColon>Sequence Number</nz-form-label>
                  <nz-form-control
                    nzHasFeedback
                    nzErrorTip="Please Enter Sequence Number"
                  >
                    <input
                      nz-input
                      name="SequenceNumber"
                      [(ngModel)]="data.SEQUENCE_NUMBER"
                      maxlength="128"
                      required
                      placeholder="Enter Sequence Number"
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
              </div>
              
              <div nz-col nzSpan="24">
                <nz-form-item>
                  <nz-form-label nzNoColon>Description</nz-form-label>
                  <nz-form-control
                    nzHasFeedback
                    nzErrorTip=" Please Enter Description"
                  >
                    <textarea
                      nz-input
                      style="width: 100%"
                      rows="4"
                      name="contactaddress"
                      [(ngModel)]="data.DESCRIPTION"
                      maxlength="2056"
                      [disabled]="InupuDisabled"
                      placeholder="Enter Description"
  
                      required
                    ></textarea>
                    <h5 style="color: red" *ngIf="data.DESCRIPTION != undefined">
                      {{ data.DESCRIPTION.length }}/2056
                    </h5>
                  </nz-form-control>
                </nz-form-item>
              </div>
              
             
  
              <div nz-col nzSpan="24" style="padding: 16px; margin-top: 0px;padding-top: 0px;">
                <div nz-col nzSpan="12">
                  <!-- Image Upload Button -->
                  <input type="file" (change)="onImageSelected($event)" accept="image/*" id="imageInput" hidden>
                  <button (click)="selectImage()">Select Profile Image</button>
                </div>
              
                <!-- Display Image Name and Delete Button if image is selected -->
                <div *ngIf="data.PROFILE_IMAGE" nz-col nzSpan="12" style="display: flex; align-items: center;">
                  <p>{{ data.PROFILE_IMAGE }}</p>
                  <button
                    (click)="deleteImage()"
                    [nzSize]="'default'"
                    nz-button
                    style="margin-left: 20px"
                  >
                    <nz-badge>
                      <i
                        style="font-size: 15px; color: red"
                        nz-icon
                        nzType="delete"
                      ></i>
                    </nz-badge>
                  </button>
                </div>
              </div>
              
  
              
            </div>
          </div>
  
         
        </div>
      </nz-spin>
    </form>
  
    <div class="footer">
      <button
        type="button"
        nz-button
        (click)="close()"
        class="ant-btn"
        style="margin-right: 8px"
      >
        <span>Cancel</span>
      </button>
      <button
        type="button"
        class="ant-btn ant-btn-primary"
        *ngIf="!data.ID && InupuDisabled == false"
        nz-button
        nz-dropdown
        [nzDropdownMenu]="menu"
        
        [nzLoading]="isSpinning"
        (click)="save(false, websitebannerPage)"
      >
        <span>Save & Close</span>
      </button>
      <button
        type="button"
        class="ant-btn ant-btn-primary"
        *ngIf="!data.ID && InupuDisabled == true"
        nz-button
        nz-dropdown
        [nzLoading]="isSpinning"
        (click)="save(false, websitebannerPage)"
      >
        <span>Save & Close</span>
      </button>
      <nz-dropdown-menu #menu="nzDropdownMenu" >
        <ul nz-menu>
          <li
            nz-menu-item
            class="menuc"
            style="border-radius: 4px; background-color: #40a9ff"
          >
            <a style="color: white" (click)="save(true, websitebannerPage)"
              >Save & New</a
            >
          </li>
        </ul>
      </nz-dropdown-menu>
      <button
        type="button"
        class="ant-btn ant-btn-primary"
        nz-button
        [nzLoading]="isSpinning"
        *ngIf="data.ID"
        (click)="save(false, websitebannerPage)"
      >
        <span>Update & Close</span>
      </button>
  
  
    <nz-dropdown-menu #menu="nzDropdownMenu">
      <ul nz-menu>
        <li
          nz-menu-item
          class="menuc"
          style="border-radius: 4px; background-color: #40a9ff"
        >
          <a style="color: white" (click)="save(true, websitebannerPage)"
            >Save & New</a
          >
        </li>
      </ul>
    </nz-dropdown-menu>
    </div>
  </div>
