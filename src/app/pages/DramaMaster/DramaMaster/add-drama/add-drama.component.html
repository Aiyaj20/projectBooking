<div>
  <!-- <form nz-form #form8> -->
  <form nz-form #websitebannerPage="ngForm">
    <nz-spin [nzSpinning]="isSpinning">
      <div nz-row>
        <div nz-row class="my-box1" style="width: 47%">
          <div nz-col nzSpan="24">
            <div nz-col nzSpan="24">
              <nz-form-item>
                <nz-form-label nzRequired nzNoColon> City Name </nz-form-label>
                <nz-form-control nzHasFeedback nzErrorTip=" Select City Name ">
                  <nz-select
                    nzShowSearch
                    nzAllowClear
                    nzErrorTip="Please Select City"
                    nzPlaceHolder="Please Select City "
                    name="cityid"
                    [(ngModel)]="data.CITY_ID"
                    required
                  >
                    <nz-option
                      *ngFor="let role of city"
                      [nzValue]="role.ID"
                      [nzLabel]="role.NAME"
                    >
                    </nz-option>
                  </nz-select>
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzSpan="24">
              <nz-form-item>
                <nz-form-label nzRequired nzNoColon>Drama Name</nz-form-label>
                <nz-form-control
                  nzHasFeedback
                  nzErrorTip="Please Enter Drama Name"
                >
                  <input
                    nz-input
                    name="dramaname"
                    [(ngModel)]="data.NAME"
                    maxlength="128"
                    [disabled]="InupuDisabled"
                    required
                    placeholder="Enter Drama Name"
                  />
                </nz-form-control>
              </nz-form-item>
            </div>

            <div nz-col nzSpan="24">
              <nz-form-item>
                <nz-form-label nzRequired nzNoColon>Cast Name</nz-form-label>
                <nz-form-control
                  nzHasFeedback
                  nzErrorTip="Please Enter Cast Names"
                >
                

                  <nz-select
                    name="CAST_NAMES"
                    nzShowSearch
                    nzAllowClear
                    nzPlaceHolder="Select Cast Names"
                    [(ngModel)]="data.CAST_NAMES"
                    [disabled]="InupuDisabled"

                    nzMode="tags"
                    required
                  >
                    <nz-option
                      *ngFor="let option of list"
                      [nzLabel]="option"
                      [nzValue]="option"
                    ></nz-option>
                  </nz-select>
                </nz-form-control>
              </nz-form-item>
            </div>

            
            <div nz-col nzSpan="24">
              <nz-form-item>
                <nz-form-label nzNoColon>Description</nz-form-label>
                <nz-form-control
                  nzHasFeedback
                  nzErrorTip=" Please Enter Description"
                >
                  <textarea
                    nz-input
                    style="width: 100%"
                    rows="4"
                    name="contactaddress"
                    [(ngModel)]="data.DESCRIPTION"
                    maxlength="2056"
                    [disabled]="InupuDisabled"
                    placeholder="Enter Description"

                    required
                  ></textarea>
                  <h5 style="color: red" *ngIf="data.DESCRIPTION != undefined">
                    {{ data.DESCRIPTION.length }}/2056
                  </h5>
                </nz-form-control>
              </nz-form-item>
            </div>
            

            <div nz-row>
              <div nz-col nzSpan="12">
                <nz-form-item>
                  <nz-form-label nzRequired nzNoColon>From Date</nz-form-label>
                  <nz-form-control
                    nzHasFeedback
                    nzErrorTip="Please Select From Date "
                  >
                    <nz-date-picker
                      required
                      nz-input
                      name="openingdate"
                      style="width: 100%"
                      [nzDisabledDate]="disabledStartDate2"
                      [(ngModel)]="data.FROM_DATE"
                      nzFormat="dd-MM-yyyy "
                      
                    >
                    </nz-date-picker>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div nz-col nzSpan="12">
                <nz-form-item>
                  <nz-form-label nzRequired nzNoColon>To Date</nz-form-label>
                  <nz-form-control
                    nzHasFeedback
                    nzErrorTip="Please Select To Date "
                  >
                    <nz-date-picker
                      style="width: 100%"
                      required
                      nz-input
                      [nzDisabledDate]="disabledStartDate2"
                      name="enddate"
                      [(ngModel)]="data.TO_DATE"
                      nzFormat="dd-MM-yyyy "
                    >
                    </nz-date-picker>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>

            <div nz-row>
              <div nz-col nzSpan="12">
                <nz-form-item>
                  <nz-form-label nzRequired nzNoColon>Short Code</nz-form-label>

                  <nz-form-control nzErrorTip="Please Enter Short Code ">
                    <input
                      nz-input
                      autocomplete="off"
                      maxlength="2"
                      name="EmployeeCode"
                      [(ngModel)]="data.SHORT_CODE"
                      type="text"
                      [disabled]="InupuDisabled"
                      placeholder="Enter Short Code"
                      required
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div nz-col nzSpan="12">
                <nz-form-item>
                  <nz-form-label nzNoColon nzRequired
                    >Sequence No</nz-form-label
                  >
                  <nz-form-control
                    nzHasFeedback
                    nzErrorTip="Please Enter Sequence number"
                  >
                    <input
                      nz-input
                      name="sequenceno"
                      maxlength="5"
                      width="100%"
                      [disabled]="InupuDisabled"
                      placeholder="Enter Sequence No"
                      (keypress)="omit($event)"
                      [(ngModel)]="data.SEQUENCE_NUMBER"
                      required
                    />
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div nz-col nzSpan="6">
                <nz-form-item>
                  <nz-form-label nzNoColon class="IS_ACTIVE" class="status"
                    >Status</nz-form-label
                  >
                  <nz-form-control>
                    <nz-switch
                      name="IS_ACTIVE"
                      [(ngModel)]="data.STATUS"
                      required
                      nzCheckedChildren="Active"
                      nzUnCheckedChildren="InActive"
                    ></nz-switch>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
          </div>
        </div>

        <div nz-row class="my-box1" style="margin-left: 40px; width: 47%">
          <div nz-col nzSpan="24" style="height: 40px">
            <nz-form-item>
              <nz-form-label nzRequired nzNoColon>Poster Image </nz-form-label>
              <span style="color: red; font-size: 12px !important">
                <span style="color: black"><br /><b>Note : </b></span> Selected
                image size must between 370px to 400px height
              </span>
              <span
                style="
                  margin-left: 36px;
                  color: red;
                  font-size: 12px !important;
                "
                >and 220px to 250px width.</span
              >
              <nz-form-control>
                <button
                  nz-button
                  style="height: 28px; padding: 0px 7px; font-size: 12px"
                  (click)="fileInput.click()"
                >
                  Select Image
                  <input
                    #fileInput
                    name="otherimage"
                    type="file"
                    (change)="onFileSelected1($event)"
                    style="display: none"
                    required
                  />
                </button>

                <span *ngIf="image != '' || data.DRAMA_IMAGE != ''">
                  <button
                    (click)="removeImage()"
                    [nzSize]="'default'"
                    nz-button
                    style="margin-left: 20%"
                  >
                    <nz-badge>
                      <i
                        style="font-size: 15px; color: red"
                        nz-icon
                        nzType="delete"
                      ></i>
                    </nz-badge>
                  </button>
                </span>
              </nz-form-control>
            </nz-form-item>

            <div
              *ngIf="image != ''"
              style="justify-content: center; display: flex; margin-top: 20px"
            >
              <img
                width="50%"
                height="50%"
                style="border-radius: 5px"
                src="{{ image }}"
              />
            </div>

            <br />
            <div
              nz-col
              nzSpan="23"
              *ngIf="fileURL != null"
              style="font-size: 15px; text-align: center"
            >
              <span style="font-size: 12px"> {{ fileURL.name }}</span>
            </div>

            <div nz-row>
              <div nz-col nzSpan="24">
                <div nz-row>
                  <div
                    nz-col
                    nzSpan="16"
                    *ngIf="fileURL == null && data.DRAMA_IMAGE != ''"
                    style="
                      justify-content: center;
                      display: flex;
                      margin-top: 20px;
                      margin-left: 58px;
                    "
                  >
                    <img
                      class="img"
                      style="border-radius: 5px"
                      width="230px"
                      height="70%"
                      src="{{ imgUrl }}dramaImages/{{ data.DRAMA_IMAGE }}"
                    />
                  </div>
                  <!-- <div nz-col nzSpan="23" *ngIf="fileURL!=null"
                  style="overflow: hidden; padding-left: 11px; font-size: 13px;">
                 <span style="font-size: 12px;"> {{fileURL.name}}</span>
                </div> -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nz-spin>
  </form>

  <div class="footer">
    <button
      type="button"
      nz-button
      (click)="close()"
      class="ant-btn"
      style="margin-right: 8px"
    >
      <span>Cancel</span>
    </button>
    <button
      type="button"
      class="ant-btn ant-btn-primary"
      *ngIf="!data.ID && InupuDisabled == false"
      nz-button
      nz-dropdown
      [nzDropdownMenu]="menu"
      [nzLoading]="isSpinning"
      (click)="save(false, websitebannerPage)"
    >
      <span>Save & Close</span>
    </button>
    <button
      type="button"
      class="ant-btn ant-btn-primary"
      *ngIf="!data.ID && InupuDisabled == true"
      nz-button
      nz-dropdown
      [nzLoading]="isSpinning"
      (click)="save(false, websitebannerPage)"
    >
      <span>Save & Close</span>
    </button>
    <nz-dropdown-menu #menu="nzDropdownMenu" >
      <ul nz-menu>
        <li
          nz-menu-item
          class="menuc"
          style="border-radius: 4px; background-color: #40a9ff"
        >
          <a style="color: white" (click)="save(true, websitebannerPage)"
            >Save & New</a
          >
        </li>
      </ul>
    </nz-dropdown-menu>
    <button
      type="button"
      class="ant-btn ant-btn-primary"
      nz-button
      [nzLoading]="isSpinning"
      *ngIf="data.ID"
      (click)="save(false, websitebannerPage)"
    >
      <span>Update & Close</span>
    </button>


  <nz-dropdown-menu #menu="nzDropdownMenu">
    <ul nz-menu>
      <li
        nz-menu-item
        class="menuc"
        style="border-radius: 4px; background-color: #40a9ff"
      >
        <a style="color: white" (click)="save(true, websitebannerPage)"
          >Save & New</a
        >
      </li>
    </ul>
  </nz-dropdown-menu>
  </div>
</div>
